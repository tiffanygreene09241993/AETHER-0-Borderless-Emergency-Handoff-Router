name: Evidence Core Adapter Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Evidence Core adapter & validator test suites (TypeScript)
        run: npm test

      - name: Run Evidence Core manifest helper tests (Python)
        run: python3 tools/evidence_core_manifest.py
